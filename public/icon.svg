<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31748f" />
      <stop offset="100%" stop-color="#286983" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6c177" />
      <stop offset="100%" stop-color="#ea9d34" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebbcba" />
      <stop offset="100%" stop-color="#c4a7e7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#191724" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#191724" />

  <!-- Ledger Book Spine / Cover -->
  <g filter="url(#shadow)">
    <!-- Main Book Cover -->
    <rect x="96" y="80" width="320" height="352" rx="24" fill="#1f1d2e" stroke="#26233a" stroke-width="4" />
    
    <!-- Spine Accent -->
    <path d="M 96,104 C 96,90.7 106.7,80 120,80 L 140,80 L 140,432 L 120,432 C 106.7,432 96,421.3 96,408 Z" fill="url(#pineGrad)" />

    <!-- Ribbon Bookmark -->
    <path d="M 276,80 L 276,210 L 300,188 L 324,210 L 324,80 Z" fill="url(#irisGrad)" />

    <!-- Calendar / Event Grid Accent -->
    <rect x="176" y="140" width="64" height="24" rx="6" fill="#eb6f92" opacity="0.9" />
    <rect x="176" y="180" width="160" height="12" rx="4" fill="#908caa" opacity="0.4" />
    <rect x="176" y="206" width="120" height="12" rx="4" fill="#908caa" opacity="0.3" />

    <!-- Ledger Rows / Coin Token -->
    <g transform="translate(176, 250)">
      <!-- Progress Bar Background -->
      <rect x="0" y="0" width="190" height="18" rx="9" fill="#26233a" />
      <rect x="0" y="0" width="130" height="18" rx="9" fill="url(#goldGrad)" />
      
      <!-- Coin Badge -->
      <circle cx="160" cy="80" r="42" fill="url(#goldGrad)" />
      <circle cx="160" cy="80" r="34" fill="#191724" />
      <text x="160" y="93" font-family="Plus Jakarta Sans, sans-serif" font-weight="bold" font-size="34" fill="#f6c177" text-anchor="middle">₹</text>

      <!-- Ledger lines -->
      <line x1="0" y1="52" x2="90" y2="52" stroke="#9ccfd8" stroke-width="8" stroke-linecap="round" />
      <line x1="0" y1="80" x2="80" y2="80" stroke="#ebbcba" stroke-width="8" stroke-linecap="round" />
      <line x1="0" y1="108" x2="95" y2="108" stroke="#f6c177" stroke-width="8" stroke-linecap="round" />
    </g>
  </g>
</svg>
